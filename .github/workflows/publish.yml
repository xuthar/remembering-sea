name: Publish Remembering Sea
on:
  push:
    branches: [main]
  schedule:
    - cron: '18 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: remembering-sea-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'xuthar/remembering-sea'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Remembering Sea
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public videos and Shorts
        continue-on-error: true
        run: |
          python -m pip install --upgrade yt-dlp
          python scripts/sync_youtube.py --limit 500
      - name: Save refreshed YouTube metadata
        run: |
          if ! git diff --quiet -- content/videos.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add content/videos.json
            git commit -m 'chore: refresh verified YouTube catalog'
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir -p public
          cp index.html archive.html poetry.html robots.txt sitemap.xml .nojekyll public/
          cp -R assets content public/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
